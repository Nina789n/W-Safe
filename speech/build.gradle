apply plugin: 'com.android.library'

def siteUrl = 'https://github.com/gotev/android-speech'
def gitUrl = 'https://github.com/gotev/android-speech.git'
def projectName = "android-speech"
def projectDesc = "Android speech recognition and text to speech made easy"
version = "1.3.1"

android {
    namespace 'com.sac.speech'
    compileSdk 34
    buildToolsVersion '34.0.0'

    defaultConfig {
        minSdk 21
        targetSdk 34
        versionCode 16
        versionName version
    }
    
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    testImplementation 'junit:junit:4.13.2'
}

